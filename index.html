<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>Do You Know Hasina?</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main id="app">

  <!-- HOME -->
  <section class="screen" id="screen-home">
    <header class="topbar">
      <h1 class="brand">Do you know<br><span>Hasina?</span></h1>
    </header>
    <div class="stack">
      <div class="progress" id="home-progress"></div>
      <button class="btn btn-primary btn-huge" id="btn-next-question">Next Question</button>
      <button class="btn btn-ghost" id="btn-home-scoreboard">Scoreboard</button>
      <button class="btn btn-ghost" id="btn-home-questions">Questions &amp; Answers</button>
      <button class="btn btn-quiet" id="btn-reset">Reset game</button>
    </div>
  </section>

  <!-- SETUP: pick penalty before revealing question -->
  <section class="screen" id="screen-setup" hidden>
    <header class="topbar">
      <button class="btn-back" data-goto="home">Back</button>
      <span class="round-tag" id="setup-round"></span>
    </header>
    <div class="stack">
      <p class="lede">Set the penalty <em>before</em> the question is revealed.</p>

      <div class="choice-row" role="group" aria-label="Penalty type">
        <button class="choice" id="choice-drink" data-type="drink">Drink</button>
        <button class="choice" id="choice-dare" data-type="dare">Dare</button>
      </div>

      <label class="field">
        <span class="field-label">What is the penalty?</span>
        <input type="text" id="penalty-input" placeholder="e.g. 5 fingers of Corona"
               autocomplete="off" autocapitalize="sentences" enterkeyhint="go">
      </label>

      <button class="btn btn-primary btn-huge" id="btn-reveal" disabled>Reveal Question</button>
    </div>
  </section>

  <!-- QUESTION -->
  <section class="screen" id="screen-question" hidden>
    <header class="topbar">
      <span class="round-tag" id="question-round"></span>
      <span class="penalty-chip" id="question-penalty-chip"></span>
    </header>
    <div class="stack">
      <p class="kicker" id="question-theme"></p>
      <p class="question-text" id="question-text"></p>

      <div class="reveal" id="bride-reveal">
        <button class="btn btn-ghost btn-reveal-answer" id="btn-peek">
          Show Hasina's answer <small>(host only)</small>
        </button>
        <div class="bride-answer" id="bride-answer" hidden>
          <span class="kicker">Hasina said</span>
          <p id="bride-answer-text"></p>
        </div>
      </div>

      <div class="verdict-row">
        <button class="btn btn-correct btn-huge" id="btn-correct">Correct</button>
        <button class="btn btn-wrong btn-huge" id="btn-wrong">Wrong</button>
      </div>
    </div>
  </section>

  <!-- PENALTY -->
  <section class="screen screen-penalty" id="screen-penalty" hidden>
    <div class="stack stack-center">
      <p class="penalty-kicker" id="penalty-kicker"></p>
      <p class="penalty-text" id="penalty-text"></p>
      <button class="btn btn-primary btn-huge" id="btn-penalty-done">Done</button>
    </div>
  </section>

  <!-- QUESTIONS EDITOR -->
  <section class="screen" id="screen-questions" hidden>
    <header class="topbar">
      <button class="btn-back" data-goto="home">Back</button>
      <h2 class="screen-title">Questions &amp; Answers</h2>
    </header>
    <div class="stack">
      <p class="lede" id="questions-summary"></p>
      <button class="btn btn-primary" id="btn-add-question">Add question</button>
      <div id="questions-list"></div>
      <button class="btn btn-ghost" id="btn-download-questions">Download questions.json</button>
      <button class="btn btn-quiet" id="btn-revert-questions">Discard edits, reload questions.json</button>
    </div>
  </section>

  <!-- SCOREBOARD -->
  <section class="screen" id="screen-scoreboard" hidden>
    <header class="topbar">
      <button class="btn-back" data-goto="home">Back</button>
      <h2 class="screen-title">Scoreboard</h2>
    </header>
    <div class="stack">
      <div class="tally">
        <div class="tally-cell tally-correct">
          <span class="tally-num" id="tally-correct">0</span>
          <span class="tally-label">Correct</span>
        </div>
        <div class="tally-cell tally-wrong">
          <span class="tally-num" id="tally-wrong">0</span>
          <span class="tally-label">Wrong</span>
        </div>
      </div>

      <div class="filter-row" role="group" aria-label="Filter results">
        <button class="filter is-active" data-filter="all">All</button>
        <button class="filter" data-filter="correct">Correct</button>
        <button class="filter" data-filter="wrong">Wrong</button>
      </div>

      <div class="table-wrap">
        <table class="results">
          <thead>
            <tr>
              <th>#</th><th>Question</th><th>Hasina said</th><th>Penalty</th><th>Result</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>

      <button class="btn btn-ghost" id="btn-download">Download results as JSON</button>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>

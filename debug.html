<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storage check</title>
<style>
  body { margin:0; padding:20px; background:#0b0b12; color:#f4f4f7;
         font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#9a9aae; margin:0 0 20px; }
  .box { background:#16161f; border:1px solid #2e2e3d; border-radius:14px;
         padding:16px; margin-bottom:14px; }
  .big { font-size:34px; font-weight:800; color:#f5c451; line-height:1.1; }
  .lbl { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#9a9aae; }
  .ok { color:#2fbf6b; font-weight:700; }
  .bad { color:#e5484d; font-weight:700; }
  pre { white-space:pre-wrap; word-break:break-all; font-size:11px;
        background:#0b0b12; border:1px solid #2e2e3d; border-radius:10px;
        padding:12px; max-height:320px; overflow:auto; }
  button { font:inherit; font-weight:700; width:100%; padding:16px;
           border-radius:14px; border:0; background:#f5c451; color:#1a1405;
           margin-bottom:10px; }
  .ghost { background:#16161f; color:#f4f4f7; border:1px solid #2e2e3d; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td,th { text-align:left; padding:6px 4px; border-bottom:1px solid #2e2e3d; }
  th { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#9a9aae; }
</style>
</head>
<body>
<h1>Storage check</h1>
<p class="sub">Reads this browser's saved game. Nothing is sent anywhere.</p>
<div id="out"></div>
<button id="dl">Download everything as JSON</button>
<button class="ghost" id="copy">Copy to clipboard</button>
<button class="ghost" onclick="location.href='index.html'">Back to the game</button>

<script>
var STATE = 'hasina-state-v2', QS = 'hasina-questions-v2';
var out = document.getElementById('out');
var dump = { origin: location.origin, path: location.pathname, keys: {} };

function box(html) { var d = document.createElement('div'); d.className = 'box'; d.innerHTML = html; out.appendChild(d); }
function esc(s) { return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

var all = [];
try { for (var i = 0; i < localStorage.length; i++) all.push(localStorage.key(i)); }
catch (e) { box('<span class="bad">localStorage is blocked in this browser (private mode?).</span>'); }

all.forEach(function (k) { try { dump.keys[k] = localStorage.getItem(k); } catch (e) {} });

var raw = null;
try { raw = localStorage.getItem(STATE); } catch (e) {}

if (!raw) {
  box('<span class="bad">No saved game found in THIS browser.</span>'
    + '<p class="sub" style="margin:8px 0 0">Storage is per browser, per site. If you played somewhere else '
    + '&mdash; a different browser, a private tab, or the offline file instead of this site &mdash; '
    + 'the rounds are there, not here.</p>');
} else {
  var st = null;
  try { st = JSON.parse(raw); } catch (e) {
    box('<span class="bad">Saved data is corrupt and could not be read.</span><pre>' + esc(raw.slice(0, 600)) + '</pre>');
  }
  if (st && st.rounds) {
    var c = st.rounds.filter(function (r) { return r.result === 'correct'; }).length;
    var w = st.rounds.filter(function (r) { return r.result === 'wrong'; }).length;
    box('<div class="lbl">Rounds saved here</div><div class="big">' + st.rounds.length + '</div>'
      + '<div style="margin-top:8px">' + c + ' correct &middot; ' + w + ' wrong</div>');

    var rows = st.rounds.map(function (r) {
      return '<tr><td>' + (r.round == null ? '?' : r.round) + '</td><td>' + esc(r.question || '')
           + '</td><td>' + esc(r.result || '') + '</td><td>'
           + esc(r.penaltyDescription || '') + '</td></tr>';
    }).join('');
    box('<table><tr><th>#</th><th>Question</th><th>Result</th><th>Penalty</th></tr>' + rows + '</table>');
  }
}

box('<div class="lbl">All storage keys on this site</div><pre>'
  + esc(all.length ? all.join('\n') : '(none)') + '</pre>');
box('<div class="lbl">Raw saved game</div><pre>' + esc(raw || '(nothing)') + '</pre>');

var blobText = JSON.stringify(dump, null, 2);
document.getElementById('dl').onclick = function () {
  var b = new Blob([blobText], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'storage-dump.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
};
document.getElementById('copy').onclick = function () {
  navigator.clipboard.writeText(blobText).then(
    function () { alert('Copied.'); },
    function () { alert('Copy failed - use Download instead.'); });
};
</script>
</body>
</html>
